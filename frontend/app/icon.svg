<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1322" />
      <stop offset="45%" stop-color="#060A14" />
      <stop offset="100%" stop-color="#020307" />
    </linearGradient>

    <!-- Outer Squircle Border Gradient -->
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#0284C7" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#1E3A8A" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.75" />
    </linearGradient>

    <!-- Badge Screen Background -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1B30" />
      <stop offset="100%" stop-color="#040813" />
    </linearGradient>

    <!-- Badge Glowing Border -->
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Play Button Electric Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- AI Sparkle Radiant Gradient -->
    <radialGradient id="sparkleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#00F2FE" />
    </radialGradient>

    <!-- Trajectory Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="1" />
    </linearGradient>

    <!-- Ambient Center Light -->
    <radialGradient id="ambientCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.32" />
      <stop offset="65%" stop-color="#0369A1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#060A14" stop-opacity="0" />
    </radialGradient>

    <!-- Inner Badge Radial Glow -->
    <radialGradient id="badgeCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#040813" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow / Glow Filter for Play Icon -->
    <filter id="playGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glow for Sparkle -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Squircle Canvas -->
  <rect x="20" y="20" width="472" height="472" rx="116" ry="116" fill="url(#bgGrad)" stroke="url(#squircleBorder)" stroke-width="4.5" />

  <!-- Ambient Blue Radial Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#ambientCenter)" />

  <!-- YouTube Creator Screen Badge -->
  <rect x="72" y="122" width="368" height="268" rx="72" ry="72" fill="url(#badgeGrad)" stroke="url(#badgeBorder)" stroke-width="4" />

  <!-- Inner Badge Glow behind Play Button -->
  <circle cx="256" cy="256" r="140" fill="url(#badgeCoreGlow)" />

  <!-- Analytics Growth Trend Bars (Left of Badge) -->
  <rect x="118" y="305" width="11" height="32" rx="5.5" fill="#0284C7" fill-opacity="0.55" />
  <rect x="136" y="285" width="11" height="52" rx="5.5" fill="#0EA5E9" fill-opacity="0.7" />
  <rect x="154" y="262" width="11" height="75" rx="5.5" fill="#38BDF8" fill-opacity="0.85" />

  <!-- Dynamic Trajectory Curve -->
  <path d="M 110 340 C 210 345, 280 310, 390 235" fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Trendline Data Nodes -->
  <circle cx="118" cy="340" r="3.5" fill="#FFFFFF" />
  <circle cx="190" cy="341" r="3.5" fill="#FFFFFF" />
  <circle cx="280" cy="310" r="3.5" fill="#FFFFFF" />
  <circle cx="390" cy="235" r="4.5" fill="#FFFFFF" filter="url(#starGlow)" />

  <!-- Hero Play Button (Smooth Rounded Triangle) -->
  <path d="M 230 208 C 230 197 242 190 252 196 L 332 244 C 341 250 341 262 332 268 L 252 316 C 242 322 230 315 230 304 Z" 
        fill="url(#playGrad)" filter="url(#playGlow)" />

  <!-- Primary AI Assistant Sparkle Star (Top Right) -->
  <g transform="translate(394, 116)" filter="url(#starGlow)">
    <path d="M 0 -52 Q 0 0 -52 0 Q 0 0 0 52 Q 0 0 52 0 Q 0 0 0 -52 Z" fill="url(#sparkleGrad)" />
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
  </g>

  <!-- Secondary Sparkle (Accent) -->
  <g transform="translate(444, 190)" opacity="0.85">
    <path d="M 0 -20 Q 0 0 -20 0 Q 0 0 0 20 Q 0 0 20 0 Q 0 0 0 -20 Z" fill="#38BDF8" />
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Micro Sparkle (Bottom Left Accent) -->
  <g transform="translate(92, 358)" opacity="0.7">
    <path d="M 0 -16 Q 0 0 -16 0 Q 0 0 0 16 Q 0 0 16 0 Q 0 0 0 -16 Z" fill="#00F2FE" />
  </g>
</svg>